name: fetch
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 发行版标签
        required: true
        default: files-20261105
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash fetch.sh "${{ inputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
